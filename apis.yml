aid: diagrid
name: Diagrid
description: >-
  Diagrid is the execution layer for production AI, built by the creators of the
  open source Dapr and KEDA projects. Its managed platform, Diagrid Catalyst,
  gives AI agents, workflows, and MCP servers durable execution (applications
  resume from the last completed step after crashes or outages) and verifiable
  execution (every step is cryptographically signed into a tamper-evident audit
  log). Catalyst exposes the Dapr APIs — service invocation, publish/subscribe,
  state management, workflows, and conversation/LLM calls — as a serverless,
  fully managed service with SPIFFE-based workload identity, mutual TLS, and
  declarative access policies. Diagrid Conductor is a companion product for
  operating and managing Dapr and KEDA across Kubernetes clusters. The platform
  is delivered as a free Catalyst Cloud tier and a self-hosted Catalyst
  Enterprise offering, is SOC 2 Type II certified, and is driven through a rich
  diagrid CLI, per-language SDKs, and a Terraform provider.
